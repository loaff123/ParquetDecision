name: qualified-linux-alpha
on: [push, pull_request]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Qualify source, built wheel and extracted sdist
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME
          export PYTHONDONTWRITEBYTECODE=1
          deps=(build==1.3.0 setuptools==80.9.0 wheel==0.45.1 packaging==26.3 pyproject-hooks==1.3.3 pytest==8.4.2 duckdb==1.5.4 pyarrow==25.0.0 pluggy==1.6.0 iniconfig==2.3.0 pygments==2.21.0)
          python -m pip install "${deps[@]}"
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
          python -m pytest -p no:cacheprovider
          python -m build --no-isolation
          sha256sum dist/*

          # Each installed mode has its own venv and source-free test directory.
          # No editable installation or checkout path is carried into those venvs.
          base_python="$(command -v python)"
          workspace="$PWD"
          qualification="$(mktemp -d "${RUNNER_TEMP}/parquet-decision-qualification.XXXXXX")"
          tar -xzf "$workspace/dist/parquet_decision-0.1.0a1.tar.gz" -C "$qualification"
          extracted="$qualification/parquet_decision-0.1.0a1"
          for mode in wheel sdist; do
            "$base_python" -m venv "$qualification/$mode-env"
            py="$qualification/$mode-env/bin/python"
            "$py" -m pip install "${deps[@]}"
            if [ "$mode" = wheel ]; then
              artifact="$workspace/dist/parquet_decision-0.1.0a1-py3-none-any.whl"
              suite_source="$workspace"
            else
              artifact="$extracted"
              suite_source="$extracted"
            fi
            "$py" -m pip install --no-deps --no-build-isolation "$artifact"
            "$py" -m pip check
            suite="$qualification/$mode-suite"
            mkdir "$suite"
            cp -a "$suite_source/tests" "$suite_source/docs" "$suite_source/examples" "$suite_source/evidence" "$suite/"
            cp "$suite_source/README.md" "$suite_source/LICENSE" "$suite_source/MANIFEST.in" "$suite_source/pyproject.toml" "$suite/"
            test ! -e "$suite/src"
            cd "$suite"
            "$py" -I - "$workspace" "$extracted" <<'PY'
          import importlib.metadata as metadata
          import importlib.util
          import json
          from pathlib import Path
          import platform
          import sys
          import sysconfig
          import parquet_decision
          import pyarrow
          root = Path(parquet_decision.__file__).resolve().parent
          site = Path(sysconfig.get_path("purelib")).resolve()
          assert platform.system() == "Linux"
          assert platform.python_version() == "3.12.14"
          assert pyarrow.__version__ == "25.0.0"
          assert root.is_relative_to(site), (root, site)
          forbidden = [Path(p).resolve() for p in sys.argv[1:]]
          assert not any(root.is_relative_to(p) for p in forbidden)
          assert not any(Path(p).resolve().is_relative_to(f) for p in sys.path for f in forbidden)
          for module in root.glob("*.py"):
              name = "parquet_decision" if module.stem == "__init__" else "parquet_decision." + module.stem
              assert Path(importlib.util.find_spec(name).origin).resolve() == module
          direct = json.loads(metadata.distribution("parquet-decision").read_text("direct_url.json"))
          assert not direct.get("dir_info", {}).get("editable", False)
          print(json.dumps({"python": platform.python_version(), "pyarrow": pyarrow.__version__, "import_root": str(root), "source_free_suite": str(Path.cwd())}, sort_keys=True))
          PY
            "$py" -I -m pytest -p no:cacheprovider
            cd "$workspace"
          done
